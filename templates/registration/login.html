{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
    <h2>Log in</h2>
    <form method='post'>
        {% csrf_token %}
        {{ form.as_p }}
        <button type='submit'>Log In</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up here</a>.</p>
{% endblock %}
